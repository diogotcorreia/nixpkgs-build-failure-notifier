[package]
name = "nixpkgs-build-failure-notifier"
version = "0.3.5"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
brotli = "8.0.2"
clap = { version = "4.5.53", features = ["derive", "env"] }
itertools = "0.15.0"
keyv = { version = "0.3.0", features = ["postgres"] }
lettre = "0.11.19"
reqwest = { version = "0.13.0", features = ["blocking", "json"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
struson = { version = "0.7.0", features = ["simple-api"] }
tokio = "1.48.0"
